name: Publish verified Werewolf v2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-werewolf-v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact tested APK candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37200418799
          name: ShatteredPD-Werewolf-v2-APK-candidate
          path: candidate
      - name: Download official signing verifier
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37200418799
          name: werewolf-v2-metadata
          path: metadata
      # Only public APK bytes and signatures are included below, never a private signing key.
      - name: Reconstruct locally signed APK and verify exact hashes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,gzip,json,hashlib,pathlib,shutil
          base=pathlib.Path('candidate/ShatteredPD-Werewolf-v4.0.0-werewolf.2-candidate.apk').read_bytes()
          overlay=json.loads(gzip.decompress(base64.b64decode('')))
          assert overlay['schema']==1
          assert hashlib.sha256(base).hexdigest()==overlay['base_sha256']=='9f79d97631f331fbe32dc40fd313eb015422ec765d7cfcd059634d2da009ea1a'
          result=bytearray()
          for part in overlay['segments']:
              if 'copy' in part:
                  start,length=part['copy']
                  assert start>=0 and length>=0 and start+length<=len(base)
                  result.extend(base[start:start+length])
              else: result.extend(base64.b64decode(part['data'],validate=True))
          assert len(result)==overlay['output_size']==35145572
          sha=hashlib.sha256(result).hexdigest()
          assert sha==overlay['output_sha256']=='639170ac5bda8b2edc96998ce52922cabf15caa54d98109648ff77644b9bf33d'
          patch=pathlib.Path('Werewolf-v4.0.0.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='13ae5aa0bc268ab2ff195d46002585cf85fd643ecf3814ca80040d13f886b045'
          dist=pathlib.Path('dist');dist.mkdir()
          (dist/'ShatteredPD-Werewolf-v2.apk').write_bytes(result)
          (dist/'SHA256SUMS.txt').write_text(sha+'  ShatteredPD-Werewolf-v2.apk\n')
          (dist/'WEREWOLF_UPDATE_V2_KO.md').write_bytes(base64.b64decode(''))
          (dist/'APK-VERIFICATION.json').write_bytes(base64.b64decode(''))
          pathlib.Path('release-notes.md').write_bytes(base64.b64decode(''))
          shutil.copyfile(patch,dist/'Werewolf-v4.0.0-v2.patch')
          print('Reconstructed signed APK exactly matches verified local file:',sha)
          PYCODE
      - name: Verify Android signature and publish downloadable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          java -jar metadata/apksigner.jar verify --verbose --print-certs dist/ShatteredPD-Werewolf-v2.apk > signature-check.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          assert 'Signer #1 certificate SHA-256 digest: f0b54ef3f02d3344980f507dcab75bd7cb02e34a0dd8465aef73da7c01a4d486' in Path('signature-check.txt').read_text()
          PYCODE
          gh release create v4.0.0-werewolf.2 dist/ShatteredPD-Werewolf-v2.apk dist/WEREWOLF_UPDATE_V2_KO.md dist/SHA256SUMS.txt dist/Werewolf-v4.0.0-v2.patch dist/APK-VERIFICATION.json --target 2a2fc1764e66b813958058ed2809b5593926df86 --title '늑대인간 모드 v2 — 충전 성장·달려들기 UI·철 정제' --notes-file release-notes.md
